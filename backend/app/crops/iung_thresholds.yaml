# Critical climatic water balance (KBW = P − ETP) values of the IUNG-PIB Agricultural Drought Monitoring System
# (SMSR, susza.iung.pulawy.pl). A KBW at or below the value in a six-dekad period means agricultural drought:
# a yield loss of at least 20 % against average weather (IUNG-PIB 2019 expertise, p. 5).
#
# Values are copied MECHANICALLY (script, not by hand) from the official annex of the regulation, fetched from
# https://api.sejm.gov.pl/eli/acts/DU/2019/739/text.html on 2026-11-22 (status "obowiązujący", no amendments).
# Cross-checked value by value against Table 3 of the IUNG-PIB expertise (umowa 155/19, Puławy, July 2019,
# https://www.gov.pl/attachment/4b6eb509-6dec-4af6-902b-4eeb5312f36d) — identical.
# "x" (period not assessed for the crop) and "-" (soil category not assessed) in the annex are null here.
#
# Only crops of our catalogue are listed. Grassland has no value in the regulation (no threshold, said in the report).
# Hop, tobacco, fruit shrubs and trees, strawberries, pulses and silage maize are also in the annex; add them here
# together with the crop in catalog.yaml.
source: "Rozporządzenie Ministra Rolnictwa i Rozwoju Wsi z dnia 11 kwietnia 2019 r. w sprawie wartości klimatycznego bilansu wodnego dla poszczególnych gatunków roślin uprawnych i gleb (Dz. U. 2019 poz. 739), załącznik; metodyka: System Monitoringu Suszy Rolniczej IUNG-PIB"
url: "https://api.sejm.gov.pl/eli/acts/DU/2019/739/text.html"
accessed: "2026-11-22"
# The 14 six-dekad periods (annex column order), MM-DD/MM-DD, both ends inclusive.
periods: ["03-21/05-20", "04-01/05-31", "04-11/06-10", "04-21/06-20", "05-01/06-30", "05-11/07-10", "05-21/07-20", "06-01/07-31", "06-11/08-10", "06-21/08-20", "07-01/08-31", "07-11/09-10", "07-21/09-20", "08-01/09-30"]
